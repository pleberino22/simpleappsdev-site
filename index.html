<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>simpleappsdev — small apps that do one thing each</title>
<meta name="description" content="A portfolio of small, paid iPhone apps. Each one does a single thing.">
<link rel="canonical" href="https://simpleappsdev.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="simpleappsdev — small apps that do one thing each">
<meta property="og:description" content="A portfolio of small, paid iPhone apps. Each one does a single thing.">
<meta property="og:url" content="https://simpleappsdev.com/">
<meta property="og:image" content="https://simpleappsdev.com/assets/og/home.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="./">simpleappsdev</a><span class="dot"></span>
  </header>
  <main>
    <h1 class="site-line">Small apps that do one thing each.</h1>
    <nav class="grid" id="grid" aria-label="Apps">
      <!-- STATIC MIRROR OF apps.json — keep the two in step when an app is
           added, renamed, repriced or released. This is what a visitor with
           no JavaScript, or with a failed fetch, gets; the script clears it
           and renders the live list on load. The store link belongs to this
           fallback only — the real card links to the app page, never the
           store. A pending app gets no store link here at all. -->
      <a class="card themed" href="kcal/" style="--accent-l:#FF7A00;--accent-d:#FF8F2A">
        <img class="tile" src="assets/icons/kcal.png" alt="" width="64" height="64">
        <span class="card-body">
          <span class="card-name">Kcal</span>
          <span class="card-tag">Calories and macros. Nothing else.</span>
          <span class="card-price">$0.99</span>
        </span>
      </a>
      <p class="notice">Kcal on the <a href="https://apps.apple.com/app/id6786282885">App Store</a>.</p>
    </nav>
  </main>
  <!-- static mirror of apps.json, same contract as the grid above -->
  <footer class="foot" id="foot">
    <a href="https://instagram.com/simpleappsdev">Instagram</a>
    <a href="mailto:support@simpleappsdev.com">support@simpleappsdev.com</a>
  </footer>
</div>
<script>
(function () {
  /* a value the owner hasn't filled in yet is marked, never empty — treat it as absent */
  function val(v) {
    return (typeof v === 'string' && v !== '' && v.slice(0, 5) !== 'TODO:') ? v : null;
  }
  function wordmark(app, cls) {
    var s = document.createElement('span');
    s.className = cls;
    s.setAttribute('aria-hidden', 'true');
    s.textContent = app.name;
    return s;
  }
  /* icon if the owner uploaded one, the gradient wordmark otherwise —
     both are finished states, and a 404 falls back to the wordmark too */
  function tile(app, cls, px, prefix) {
    var src = val(app.icon);
    if (!src) return wordmark(app, cls);
    var img = document.createElement('img');
    img.className = cls;
    img.src = prefix + src;
    img.alt = '';
    img.width = px;
    img.height = px;
    img.addEventListener('error', function () {
      img.replaceWith(wordmark(app, cls));
    });
    return img;
  }

  function render(data) {
    var grid = document.getElementById('grid');
    grid.textContent = '';  /* drops the static fallback, store link and all */
    (data.apps || []).forEach(function (app) {
      var a = document.createElement('a');
      a.className = 'card themed';
      a.href = app.url;
      a.style.setProperty('--accent-l', app.accentLight);
      a.style.setProperty('--accent-d', app.accentDark);

      var body = document.createElement('span');
      body.className = 'card-body';
      var name = document.createElement('span');
      name.className = 'card-name';
      name.textContent = app.name;
      var tag = document.createElement('span');
      tag.className = 'card-tag';
      tag.textContent = app.tagline;
      body.append(name, tag);

      var price = val(app.price);
      if (price) {
        var p = document.createElement('span');
        p.className = 'card-price';
        p.textContent = price;
        body.appendChild(p);
      }

      a.append(tile(app, 'tile', 64, ''), body);
      grid.appendChild(a);
    });

    var foot = document.getElementById('foot');
    foot.textContent = '';
    var ig = val(data.instagram);
    if (ig) {
      var i = document.createElement('a');
      i.href = ig;
      i.textContent = 'Instagram';
      foot.appendChild(i);
    }
    var mail = val(data.supportEmail);
    if (mail) {
      var m = document.createElement('a');
      m.href = 'mailto:' + mail;
      m.textContent = mail;
      foot.appendChild(m);
    }
  }

  fetch('apps.json')
    .then(function (r) {
      if (!r.ok) throw new Error('apps.json ' + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (err) {
      /* the static fallback in #grid is untouched — the visitor keeps a card,
         a tagline, a price and a way to the store */
      console.error('Could not load apps.json:', err);
    });
})();
</script>
</body>
</html>
